server.port=8332

server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.remote-ip-header=x-forwarded-for

spring.main.lazy-initialization=true

spring.jpa.open-in-view=true

management.endpoints.web.base-path=/manage

spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.servlet.session.cookie.same-site=None
server.servlet.session.persistent=true
server.servlet.session.cookie.max-age=64800
server.servlet.session.timeout=8h

di.saml.pages.success=/
di.saml.pages.nonsecured=/,/manage/**,/error,/webjars/**,/css/**,/js/**,/img/**,/favicon.ico,/api/**,/custom/**

spring.flyway.enabled=true
spring.flyway.table=schema_version
spring.flyway.database-type=mysql

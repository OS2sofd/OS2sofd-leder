<!DOCTYPE html>
<html>
<head th:replace="fragments/header :: header(texteditor = true)" />
<body class="top-navigation">
	<div id="wrapper">
		<nav th:replace="fragments/navbar :: navbar-aside" />
	    <div id="page-wrapper" class="gray-bg">
	    	<nav th:replace="fragments/navbar :: navbar-header" />

	        <div class="wrapper wrapper-content">
	            <div class="row">
	                <div class="col-lg-12">
                        <div class="ibox">
                            <div class="ibox-title">
                                <h5><em class="fa fa-pencil"></em> &nbsp; Rediger velkomsttekst</h5>
                            </div>
		
                            <div class="ibox-content" >
								<p>Her kan du redigere den tekst, der vises på velkomstsiden.</p>
								
								<form action="#" th:action="@{/admin/welcome/edit}" th:object="${TextDTO}" method="post">
									<textarea id="content" class="form-control" th:field="*{value}" autocomplete="off"></textarea>
									<p th:if="${showError}" style="color: red;">Den indtastede tekst er for lang. Der tillades max 65536 tegn (inkl formattering)</p>
									<br/>

									<button type="submit" class="btn btn-primary block full-width m-b">Gem tekst</button>
									<a th:href="@{/}" class="btn btn-danger block full-width m-b">Annuller</a>
								</form>
	                        </div>
	                    </div>
	                </div>
	            </div>
	        </div>
	    </div>
	</div>
	
	<div th:replace="fragments/footer :: scripts(texteditor = true)"></div>
	<script th:inline="javascript">
		/*<![CDATA[*/
		
			/*[+
			+]*/
			
			var token = $("meta[name='_csrf']").attr("content");
			$(document).ready(function () {
				$('#content').summernote({
					"height": 320,
					"toolbar": [
						[ "font", [ "bold", "italic", "underline" ]],
						[ "para", [ "ul", "ol", "style" ]],
	                    [ "insert", ["link"]]
					]
				});
			});
			
		/*]]>*/
	</script>
</body>
</html>

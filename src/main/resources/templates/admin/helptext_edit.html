<!DOCTYPE html>
<html>
<head th:replace="fragments/header :: header(texteditor = true)" />
<body class="top-navigation">
	<div id="wrapper">
		<nav th:replace="fragments/navbar :: navbar-aside" />
	    <div id="page-wrapper" class="gray-bg">
	    	<nav th:replace="fragments/navbar :: navbar-header" />

	        <div class="wrapper wrapper-content">
	            <div class="row">
	                <div class="col-lg-12">
                        <div class="ibox" sec:authorize="hasRole('ROLE_ADMIN')">

                                <h5><em class="fa fa-pencil"></em> &nbsp; Rediger tekster</h5>
                            </div>

							<div class="ibox-content" >
								<form action="#" th:action="@{/admin/helptext/edit}" th:object="${helpText}" method="post">

										<label class="col-sm-2 col-form-label" th:text="${helpText.textType.getDisplayValue()}"></label>
										<div class="col-sm-10">
											<textarea th:name="${helpText.textType.name()}" class="form-control" autocomplete="off" maxlength="65536">[[${helpText.value}]]</textarea>
										</div>
									</div>
									<div class="form-group row">
										<button type="submit" class="btn btn-primary block full-width m-b">Gem</button>
										<a th:href="@{/}" class="btn btn-danger block full-width m-b">Annuller</a>
									</div>
								</form>
							</div>

	                    </div>
	                </div>
	            </div>
	        </div>
	    </div>
	</div>
	
	<div th:replace="fragments/footer :: scripts(texteditor = true)"></div>

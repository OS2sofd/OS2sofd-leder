<!DOCTYPE html>
<html>
<head th:replace="fragments/header :: header(texteditor = true)" />
<body class="top-navigation">
	<div id="wrapper">
		<nav th:replace="fragments/navbar :: navbar-aside" />
	    <div id="page-wrapper" class="gray-bg">
	    	<nav th:replace="fragments/navbar :: navbar-header" />

	        <div class="wrapper wrapper-content">
	            <div class="row">
	                <div class="col-lg-12">
                        <div class="ibox" sec:authorize="hasRole('ROLE_ADMIN')">
                            <div class="ibox-title">
                                <h5><em class="fa fa-pencil"></em> &nbsp; Rediger hjælpetekster</h5>
                            </div>
		
                            <div class="ibox-content" >
								<p>Her kan du redigere den hjælpetekst, der vises på stedfortrædersiden.</p>
								
								<form action="#" th:action="@{/admin/helptext/edit}" th:object="${helpText}" method="post">
									<textarea id="content" class="form-control" th:field="*{value}" autocomplete="off"></textarea>
									<p th:if="${showError}" style="color: red;">Den indtastede tekst er for lang. Der tillades max 65536 tegn</p>
									<br/>

									<button type="submit" class="btn btn-primary block full-width m-b">Gem tekst</button>
									<a th:href="@{/}" class="btn btn-danger block full-width m-b">Annuller</a>
								</form>
	                        </div>
	                    </div>
						<div class="ibox" sec:authorize="!hasRole('ROLE_ADMIN') AND hasRole('ROLE_READER')">
							<div class="ibox-title">
								<h5><em class="fa fa-eye"></em> &nbsp; Se hjælpetekster</h5>
							</div>

							<div class="ibox-content" >
								<p>Her kan du se den hjælpetekst, der vises på stedfortrædersiden. Kun administratorer kan redigere hjælpetekster.</p>
								<pre th:utext="${helpText.value}"></pre>
							</div>
						</div>
	                </div>
	            </div>
	        </div>
	    </div>
	</div>
	
	<div th:replace="fragments/footer :: scripts(texteditor = true)"></div>
	<script th:inline="javascript">
		/*<![CDATA[*/
		
			/*[+
			+]*/
			
			var token = $("meta[name='_csrf']").attr("content");
			$(document).ready(function () {
				$('#content').summernote({
					"height": 320,
					"toolbar": []
				});
			});
			
		/*]]>*/
	</script>
</body>
</html>

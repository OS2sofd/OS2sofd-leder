<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header(datatables = true, datepicker = true)}"></head>
<body class="top-navigation">
<div id="wrapper">
    <nav th:replace="~{fragments/navbar :: navbar-aside (page = 'pendingapprovals')}"></nav>
    <div id="page-wrapper" class="gray-bg">
        <nav th:replace="~{fragments/navbar :: navbar-header (page = 'pendingapprovals')}"></nav>
        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h3>Konti til godkendelse</h3>
                        </div>
                        <div class="ibox-content">
                            <div class="table-responsive">
                                <table id="listTable" class="table table-striped table-hover listTable">
                                    <thead>
                                    <tr>
                                        <th class="col-md-2">Aktivering</th>
                                        <th class="col-md-5">Navn</th>
                                        <th class="col-md-2">Bruger id</th>
                                        <th class="col-md-2">Bruger type</th>
                                        <th class="col-md-1">Handlinger</th>
                                    </tr>
                                    <tr class="dt-column-filters">
                                        <th><input type="text" class="form-control input-sm" placeholder="Filtrér"/></th>
                                        <th><input type="text" class="form-control input-sm" placeholder="Filtrér"/></th>
                                        <th><input type="text" class="form-control input-sm" placeholder="Filtrér"/></th>
                                        <th><input type="text" class="form-control input-sm" placeholder="Filtrér"/></th>
                                        <th></th>
                                    </tr>
                                    </thead>

                                    <tbody>
                                    <tr th:each="order : ${orders}">
                                        <td th:text="${#dates.format(order.activationTimestamp, 'yyyy-MM-dd HH:mm')}"></td>
                                        <td th:text="${order.person.firstname + ' ' + order.person.surname}"></td>
                                        <td th:text="${order.userId}"></td>
                                        <td th:text="${order.userType}"></td>
                                        <td>
                                            <a onclick="accountOrderDatatableService.approve(this);" th:attr="data-orderid=${order.id}"><em class="fa fa-fw fa-check"></em></a>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: scripts(datatables = true, datepicker = true)}"></div>

<script th:inline="javascript">
    /*<![CDATA[*/
    var token = $("meta[name='_csrf']").attr("content");

    var accountOrderDatatableService;
    $(document).ready(function () {
        accountOrderDatatableService = new AccountOrderDatatableService();
        accountOrderDatatableService.init();
    });

    function AccountOrderDatatableService() {
        this.init = function() {
            var table = $('#listTable').DataTable($.extend(true, {},
                DTEnhance.standardOptions({ itemNamePlural: 'kontogodkendelser', excelTitle: 'Kontogodkendelser' }),
                {
                    columnDefs: [ { orderable: false, searchable: false, targets: 4 } ],
                    order: [[ 0, 'desc' ]]
                }
            ));
            DTEnhance.applyEnhancements(table);
        }

        this.approve = function(element) {
            console.log("/pendingapprovals/" + element.dataset.orderid);
            $.ajax({
                url: "/pendingapprovals/" + element.dataset.orderid,
                headers: {
                    'X-CSRF-TOKEN': token
                },
                type: 'post',
                contentType: 'application/json',
                success: function( data, textStatus, jQxhr ){
                    location.reload(true);
                },
                error: function( jqXhr, textStatus, errorThrown ){
                    $.notify({
                        message: deleteErrorMsg
                    }, {
                        status: 'danger',
                        autoHideDelay: 4000
                    });
                }
            });
        }
    }

    /*]]>*/
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head th:replace="fragments/header :: header(datatables = true, checkbox = true, jstree = true)" />
<body class="top-navigation">
	<div id="wrapper">
	    <nav th:replace="fragments/navbar :: navbar-aside(page='substitutes')" />
	    <div id="page-wrapper" class="gray-bg">
	    	<nav th:replace="fragments/navbar :: navbar-header" />

	        <div class="wrapper wrapper-content">
	            <div class="row">
	                <div class="col-lg-12">
                        <div class="ibox">
                            <div class="ibox-title">
                                <h5><em class="fa fa-users"></em> &nbsp; Stedfortrædere</h5>
                            </div>
                            <div class="ibox-content" >
								<div th:utext="${@textService.getText('SUBSTITUTE_HELPTEXT')}"></div>

                           		<button class="btn btn-primary" style="margin-bottom: 10px;" onclick="substituteService.openCreateModal();">
                               		<em class="fa fa-fw fa-user-plus"></em>
									<span>Tilføj stedfortræder</span>
								</button>
								<br/>
	                        	<table id="substitutes" class="table table-hover col-lg-12">
			                		<thead>
										<tr>
											<th class="col-lg-4">Navn</th>
											<th class="col-lg-3">Stedfortræderkontekst</th>
											<th class="col-lg-4">Afgrænsning</th>
											<th class="col-lg-1">Handlinger</th>
										</tr>
									</thead>
					                <tbody>
						                <tr th:each="assignment: ${substituteAssignments}">
						                	<td th:text="${assignment.substitute.name}"/>
						                	<td th:text="${assignment.substituteContextName}"/>
											<td>
												<ul style="list-style-type: none; padding-left: 0px; margin-bottom: 0px;">
													<li th:each="orgUnit : ${assignment.constraintOrgUnits}" th:text="${orgUnit.name}"></li>
												</ul>
											</td>
											<td>
												<a th:unless="${assignment.isOrgUnitAssignment}" href="#" onclick="substituteService.removeSubstituteAssignment(this);" th:attr="data-assignmentid=${assignment.id}">
													<em style="color: black;" class="fa fa-fw fa-times"></em>
												</a>
												<a th:if="${assignment.isOrgUnitAssignment}" href="#" onclick="substituteService.removeSubstituteOrgUnitAssignment(this);" th:attr="data-substituteuuid=${assignment.substitute.uuid}, data-contextid=${assignment.substituteContextId}">
													<em style="color: black;" class="fa fa-fw fa-times"></em>
												</a>&nbsp;
												<em onclick="substituteService.openEditModal(this);"  th:attr="data-id=${assignment.id}, data-substitutename=${assignment.substitute.name}, data-substituteuuid=${assignment.substitute.uuid}, data-contextid=${assignment.substituteContextId}, data-ous=${assignment.constraintOrgUnitsUuids}, data-orgunitassignment=${assignment.isOrgUnitAssignment}" style="cursor:pointer;color: black;" class="fa fa-fw fa-pencil"></em>
											</td>
										</tr>
					                </tbody>
			                	</table>
	                        </div>
	                    </div>
	                </div>
	            </div>
	        </div>
	    </div>
	</div>
	
	<!-- add substitute modal -->
	<div class="modal fade" id="modal-add-substitute" role="dialog">
		<div class="form-horizontal modal-dialog modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<h4>Tilføj stedfortræder</h4>
				</div>
	
				<div class="modal-body">
					<div class="form-group row">
						<label class="col-lg-2 control-label">Kontekst</label>
						<div class="col-lg-8">
							<select class="form-control" id="addSubstituteSelectedContext" onchange="substituteService.handleSubstituteContextChange();">
								<option th:each="subContext : ${substituteContexts}" th:value="${subContext.id}" th:attr="data-supportsconstraints=${subContext.supportsConstraints}, data-assignabletoorgunit=${subContext.assignableToOrgunit}, data-inherit=${subContext.inherit}">
									<span th:if="${subContext.identifier} == 'SOFD'" th:text="${@managerConfiguration.html.sofdSubstituteContextName}"></span>
									<span th:unless="${subContext.identifier} == 'SOFD'" th:text="${subContext.name}"></span>
								</option>
							</select>
						</div>
					</div>
					<div class="form-group row">
						<label class="col-lg-2 control-label">Stedfortræder</label>
						<div class="col-lg-8">
							<input type="text" class="form-control" id="addSubstituteAutocompletePerson" autocomplete="off"/>
							<div id="dropdownResultInternal" class="dropdown" data-toggle="dropdown">
						  		<ul id="searchResultDropDownMenuInternal" class="dropdown-menu" style="width: 100%; padding-left: 15px; padding-right: 15px; line-height: 25px; top: -2px !important;">
						  		</ul>
							</div>
							<input id="realPersonField" type="hidden" />
						</div>
					</div>
					<div class="form-group row">
						<label class="col-lg-2 control-label">Afdelinger
							<i id="createModalOuTooltip" style="width: 10px;" class="fa fa-question" data-toggle="tooltip" data-placement="right" title="Her kan du afgrænse stedfortræderen til udvalgte afdelinger. Hvis ingen afdeling er valgt, fungerer stedfortræderen på alle afdelinger."></i>
						</label>
						<div class="col-lg-8">
							<input id="chbxSubstituteContextConstraints" type="checkbox" class="i-checks">
							&nbsp; <span id="inheritMessage">Afdelinger nedarves for den valgte stedfortræderkontekst</span>
						</div>
					</div>
					<div class="form-group row" id="tree">
						<label class="control-label" style="margin-top: 10px;">Søg</label>
						<input class="form-control" id="orgUnitTreeSearchField" autofocus="autofocus" style="margin-bottom: 40px;" />
						<div id="orgUnitTreeHierarchy"></div>
					</div>
				</div>
	
				<div class="modal-footer">
					<button id="addBtn" type="button" class="btn btn-primary" onclick="substituteService.addSubstituteAssignment()">Tilføj</button>
					<button type="button" class="btn btn-danger" data-dismiss="modal">Annuller</button>
				</div>
			</div>
		</div>
	</div>
	
	<!-- edit substitute modal -->
	<div class="modal fade" id="modal-edit-substitute" role="dialog">
		<div class="form-horizontal modal-dialog modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<h4>Rediger stedfortræder</h4>
				</div>
	
				<div class="modal-body">
					<input id="assignmentId" hidden>
					<input id="orgUnitAssignment" hidden>
					<input id="substituteUuid" hidden>
					<input id="contextId" hidden>
					<input id="contextIsAssignableToOrgUnit" hidden>
					<div class="form-group row">
						<label class="col-lg-2 control-label">Kontekst</label>
						<div class="col-lg-8">
							<select class="form-control" id="editSubstituteSelectedContext" disabled="disabled">
								<option th:each="subContext : ${substituteContexts}" th:value="${subContext.id}" th:attr="data-supportsconstraints=${subContext.supportsConstraints}, data-assignabletoorgunit=${subContext.assignableToOrgunit}, data-inherit=${subContext.inherit}" th:text="${subContext.name}"></option>
							</select>
						</div>
					</div>
					<div class="form-group row">
						<label class="col-lg-2 control-label">Stedfortræder</label>
						<div class="col-lg-8">
							<input type="text" class="form-control" id="editSubstituteAutocompletePerson" disabled="disabled"/>
						</div>
					</div>
					<div class="form-group row">
						<label class="col-lg-2 control-label">Afdelinger
							<i id="editModalOuTooltip" style="width: 10px;" class="fa fa-question" data-toggle="tooltip" data-placement="right" title="Her kan du afgrænse stedfortræderen til udvalgte afdelinger. Hvis ingen afdeling er valgt, fungerer stedfortræderen på alle afdelinger."></i>
						</label>
						<div class="col-lg-8">
							<input id="chbxSubstituteContextConstraintsEdit" type="checkbox" class="i-checks">
							&nbsp; <span id="editInheritMessage">Afdelinger nedarves for den valgte stedfortræderkontekst</span>
						</div>
					</div>
					<div class="form-group row" id="editTree">
						<label class="control-label" style="margin-top: 10px;">Søg</label>
						<input class="form-control" id="editOrgUnitTreeSearchField" autofocus="autofocus" style="margin-bottom: 40px;" />
						<div id="editOrgUnitTreeHierarchy"></div>
					</div>
				</div>
	
				<div class="modal-footer">
					<button id="saveEdit" type="button" class="btn btn-primary" onclick="substituteService.editSubstituteAssignment(this)">Gem</button>
					<button type="button" class="btn btn-danger" data-dismiss="modal">Annuller</button>
				</div>
			</div>
		</div>
	</div>
	
	<div th:replace="fragments/footer :: scripts(datatables = true, checkbox = true, autocomplete = true, jstree = true)"></div>
	<script th:inline="javascript">
		/*<![CDATA[*/
		
			/*[+
				var substituteRestUrl = [[@{/rest/substituteAssignment}]];
				var ous = [[${ous}]];
				var allowedUuids = [[${allowedUuids}]];
			+]*/
			
			var token = $("meta[name='_csrf']").attr("content");
			var substituteService, searchService, treeService;
			$(document).ready(function () {
				$(".helpTextPopover").popover();
				
				substituteService = new SubstituteService();
				searchService = new SearchService();
				treeService = new TreeService();
				
				substituteService.init();
				searchService.init();
			});

			function TreeService() {
				this.initJSTree = function(id, searchId, inherit, ousString) {
					$('#' + id).jstree('destroy');
					var checkboxSettings = {};
					if (inherit) {
						checkboxSettings = {
												"keep_selected_style" : false,
												"three_state": false,
												"cascade" : "down"
											};
					} else {
						checkboxSettings = {
												"three_state" : false,
												"two_state": true
											};
					}

					$('#' + id).jstree({
						"core": {
							"data": ous,
							"themes": {
								"icons": false
							}
						},
						"search" : {
							"show_only_matches": true,
							"search_callback": function(str, node) {
								return (node.text.toUpperCase().includes(str.toUpperCase()));
							}
						},
						"checkbox" : checkboxSettings,
						"plugins" : ["search", "checkbox"]
					}).on('loaded.jstree', function() {
						// open nodes
						$('#' + id).jstree('open_all');
						$($('#' + id).jstree().get_json($('#' + id), {
						  flat: true
						})).each(function(index, value) {
							var node = $('#' + id).jstree().get_node(this.id);

							if (!node.original.open) {
								$('#' + id).jstree().close_node(node, false);
							}
						});

						// disable not allowed nodes
						ous.forEach(function(entry) {
							$("#" + id).jstree(true).disable_node(entry);
						});

						allowedUuids.forEach(function(entry) {
							$("#" + id).jstree(true).enable_node(entry);
						});

						// select ous in jstree if edit
						if (ousString != null && ousString.length > 0 && ousString != "[]") {
							ousString = ousString.replace("[", "").replace("]", "");
							var constraintOUs = ousString.split(", ");

							constraintOUs.forEach(function(nodeId) {
								$('#' + id).jstree(true).select_node(nodeId);
							});
							$("#chbxSubstituteContextConstraintsEdit").iCheck('check');
						} else {
							$("#chbxSubstituteContextConstraintsEdit").iCheck('uncheck');
							$("#editTree").hide();
						}
					});

					// searching in the JSTree
					var to = false;
					$('#' + searchId).keyup(function() {
						if (to) {
							clearTimeout(to);
						}

						to = setTimeout(function() {
							var v = $('#' + searchId).val();

							$('#' + id).jstree(true).search(v);
						}, 400);
					});
					$('#' + searchId).focus();

					// listener
					if (inherit) {
						$('#' + id).on('deselect_node.jstree', function (e, data) {
							// if no parent or parent is not selected - allow deselect
							var parent = $('#' + id).jstree(true).get_parent(data.node);
							if (!parent || !$('#' + id).jstree(true).is_selected(parent)) {
								return;
							} else {
								$('#' + id).jstree(true).select_node(data.node);
								return;
							}
						});
					}
				};
			}
			
			function SubstituteService() {
				
				this.init = function() {
					$('#modal-add-substitute').on('shown.bs.modal', function() {
						$('[data-toggle="tooltip"]').tooltip();
					});
					$('#modal-edit-substitute').on('shown.bs.modal', function() {
						$('[data-toggle="tooltip"]').tooltip();
					});

					$("#chbxSubstituteContextConstraints").on('ifChecked', function(event){
						$("#tree").show();
					});
					
					$("#chbxSubstituteContextConstraints").on('ifUnchecked', function(event){
						$("#tree").hide();
					});
					
					$("#chbxSubstituteContextConstraintsEdit").on('ifChecked', function(event){
						$("#editTree").show();
					});
					
					$("#chbxSubstituteContextConstraintsEdit").on('ifUnchecked', function(event){
						$("#editTree").hide();
					});
					
					var table = $('#substitutes').DataTable({
						"pageLength" : 50,
						"bLengthChange": false,
						"responsive" : true,
						"autoWidth": false,
						"columnDefs": [
							{ "orderable": false, "searchable": false, "targets": 3 }
						  ],
						"order": [ 0, 'asc' ],
                        "stateSave": true,
                        "stateDuration": -1,
						"language" : {
							"search" : "Søg",
							"lengthMenu" : "_MENU_ stedfortrædere per side",
							"info" : "Viser _START_ til _END_ af _TOTAL_ stedfortrædere",
							"zeroRecords" : "Ingen data...",
							"infoEmpty" : "",
							"infoFiltered" : "(ud af _MAX_ stedfortrædere)",
							"paginate" : {
								"previous" : "Forrige",
								"next" : "Næste"
							}
						}
					});
				}
				
				this.handleSubstituteContextChange = function() {
					var supportsConstraints = $("#addSubstituteSelectedContext").find(':selected').data("supportsconstraints");
					var assignableToOrgUnits = $("#addSubstituteSelectedContext").find(':selected').data("assignabletoorgunit");
					var inherit = $("#addSubstituteSelectedContext").find(':selected').data("inherit");
					$("#addBtn").data("inherit", inherit);
					if (inherit) {
						$("#inheritMessage").show();
					} else {
						$("#inheritMessage").hide();
					}
					treeService.initJSTree("orgUnitTreeHierarchy", "orgUnitTreeSearchField", inherit, null);

					if (assignableToOrgUnits) {
						$('#chbxSubstituteContextConstraints').iCheck('check');
						$('#chbxSubstituteContextConstraints').iCheck('disable');
						$("#createModalOuTooltip").attr("data-original-title", 'Da der er valgt en kontekst, der skal tilknyttes en afdeling, skal der vælges minimum en afdeling');
						$('[data-toggle="tooltip"]').tooltip();

						$("#tree").show();
					} else {
						$('#chbxSubstituteContextConstraints').iCheck('uncheck');
						if (!supportsConstraints) {
							$('#chbxSubstituteContextConstraints').iCheck('disable');
						} else {
							$('#chbxSubstituteContextConstraints').iCheck('enable');
						}
						$("#createModalOuTooltip").attr("data-original-title", 'Her kan du afgrænse stedfortræderen til udvalgte afdelinger. Hvis ingen afdeling er valgt, fungerer stedfortræderen på alle afdelinger.');
						$('[data-toggle="tooltip"]').tooltip();
						$("#tree").hide();
					}
				}

				this.removeSubstituteAssignment = function(elem) {
					var assignmentId = $(elem).data('assignmentid');

					swal({
						html : true,
						title : "Fjern stedfortræder",
						text : "Vil du fjerne denne stedfortræder?",
						type : "warning",
						showCancelButton : true,
						confirmButtonColor : "#DD6B55",
						confirmButtonText : "Slet",
						cancelButtonText : "Annuller",
						closeOnConfirm : true,
						closeOnCancel : true
					},
					function(isConfirm) {
						if (isConfirm) {
							$.ajax({
								method : "POST",
								url: substituteRestUrl + "/delete/" + assignmentId,
								headers: {
									'X-CSRF-TOKEN': token
								}
							}).done(function (data) {
								location.reload(true);
							}).fail(function (jqXHR, textStatus, errorThrown) {
								toastr.error("Der opstod en fejl. Kunne ikke fjerne stedfortræder.")
							});
						}
					});
				}

				this.removeSubstituteOrgUnitAssignment = function(elem) {
					var substituteUuid = $(elem).data('substituteuuid');
					var contextId = $(elem).data('contextid');

					console.log(substituteUuid);
					console.log(contextId);

					payload = {
						id: 0,
						orgUnitAssignment: true,
						substituteUuid: substituteUuid,
						contextId: contextId,
						contextIsAssignableToOrgUnit: true,
						constraints : [],
						deleteOrgUnitAssignment: true
					};

					substituteService.callEdit(payload);
				}
				
				this.openCreateModal = function() {
					$('#addSubstituteAutocompletePerson').val("");
					$('#addSubstituteSelectedContext').children().eq(0).prop('selected', true);
					substituteService.handleSubstituteContextChange();
					$('#modal-add-substitute').modal('show'); 
				}
				
				this.openEditModal = function(elem) {
					var contextId = $(elem).data('contextid');
					var substituteName = $(elem).data('substitutename');
					var ousString = $(elem).data('ous');
					var id = $(elem).data('id');
					var orgUnitAssignment =  $(elem).data('orgunitassignment');
					var substituteUuid = $(elem).data('substituteuuid');
					
					$("#assignmentId").val(id);
					$("#orgUnitAssignment").val(orgUnitAssignment);
					$("#substituteUuid").val(substituteUuid);
					$('#editSubstituteSelectedContext').val(contextId);
					$("#editSubstituteAutocompletePerson").val(substituteName);

					var supportsConstraints = $("#editSubstituteSelectedContext").find(':selected').data("supportsconstraints");
					var assignableToOrgUnits = $("#editSubstituteSelectedContext").find(':selected').data("assignabletoorgunit");
					var inherit = $("#editSubstituteSelectedContext").find(':selected').data("inherit");
					$("#saveEdit").data("inherit", inherit);
					if (inherit) {
						$("#editInheritMessage").show();
					} else {
						$("#editInheritMessage").hide();
					}
					treeService.initJSTree("editOrgUnitTreeHierarchy", "editOrgUnitTreeSearchField", inherit, ousString);
					if (assignableToOrgUnits) {
						$('#chbxSubstituteContextConstraintsEdit').iCheck('check');
						$('#chbxSubstituteContextConstraintsEdit').iCheck('disable');
						$("#editTree").show();
						$("#editModalOuTooltip").attr("data-original-title", 'Da der er valgt en kontekst, der skal tilknyttes en afdeling, skal der vælges minimum en afdeling');
						$('[data-toggle="tooltip"]').tooltip();
					} else {
						if (!supportsConstraints) {
							$("#saveEdit").prop("disabled", true);
							$('#chbxSubstituteContextConstraintsEdit').iCheck('disable');
						} else {
							$("#saveEdit").prop("disabled", false);
							$('#chbxSubstituteContextConstraintsEdit').iCheck('enable');
						}
						$("#editModalOuTooltip").attr("data-original-title", 'Her kan du afgrænse stedfortræderen til udvalgte afdelinger. Hvis ingen afdeling er valgt, fungerer stedfortræderen på alle afdelinger.');
						$('[data-toggle="tooltip"]').tooltip();
					}

					$("#contextId").val(contextId);
					$("#contextIsAssignableToOrgUnit").val(assignableToOrgUnits);

					$('#modal-edit-substitute').modal('show');
				}
				
				this.addSubstituteAssignment = function() {
					payload = {
						context : $("#addSubstituteSelectedContext option:selected").val(),
						substitute : $("#realPersonField").val(),
						constraint : null,
					};

					var includeConstraints = $('#chbxSubstituteContextConstraints').prop("checked");
					if (includeConstraints) {
						var inherit = $("#addBtn").data("inherit");
						if (inherit) {
							var selectedNodes = $('#orgUnitTreeHierarchy').jstree(true).get_selected();

							var selectedTopNodes = selectedNodes.filter(function(nodeId) {
								var parent = $('#orgUnitTreeHierarchy').jstree(true).get_parent(nodeId);
								return !$('#orgUnitTreeHierarchy').jstree(true).is_selected(parent);
							});

							payload.constraint = selectedTopNodes;
						} else {
							payload.constraint =  $('#orgUnitTreeHierarchy').jstree(true).get_selected();
						}
					}

					$.ajax({
						contentType: 'application/json',
						url: substituteRestUrl + "/add",
						method : "POST",
						data: JSON.stringify(payload),
						headers: {
							'X-CSRF-TOKEN': token
						},
						error: function(jqXHR, textStatus, errorThrown) {
							if (jqXHR.responseText != null && jqXHR.responseText != "" ) {
								toastr.error(jqXHR.responseText);
							} else {
								toastr.error("Der opstod en fejl. Prøv igen.");
							}
						},
						success: function(response) {
							location.reload(true);
						}
					});
				}
				
				this.editSubstituteAssignment = function() {
					payload = {
						id: $("#assignmentId").val(),
						orgUnitAssignment: $("#orgUnitAssignment").val(),
						substituteUuid: $("#substituteUuid").val(),
						contextId: $("#contextId").val(),
						contextIsAssignableToOrgUnit: $("#contextIsAssignableToOrgUnit").val(),
						constraints : null,
						deleteOrgUnitAssignment: false
					};

					var includeConstraints = $('#chbxSubstituteContextConstraintsEdit').prop("checked");
					if (includeConstraints) {
						var inherit = $("#saveEdit").data("inherit");
						if (inherit) {
							var selectedNodes = $('#editOrgUnitTreeHierarchy').jstree(true).get_selected();

							var selectedTopNodes = selectedNodes.filter(function(nodeId) {
								var parent = $('#editOrgUnitTreeHierarchy').jstree(true).get_parent(nodeId);
								return !$('#editOrgUnitTreeHierarchy').jstree(true).is_selected(parent);
							});

							payload.constraints = selectedTopNodes;
						} else {
							payload.constraints =  $('#editOrgUnitTreeHierarchy').jstree(true).get_selected();
						}
					}

					substituteService.callEdit(payload);
				}

				this.callEdit = function(payload) {
					$.ajax({
						contentType: 'application/json',
						url: substituteRestUrl + "/edit",
						method : "POST",
						data: JSON.stringify(payload),
						headers: {
							'X-CSRF-TOKEN': token
						},
						error: function(jqXHR, textStatus, errorThrown) {
							if (jqXHR.responseText != null && jqXHR.responseText != "" ) {
								toastr.error(jqXHR.responseText);
							} else {
								toastr.error("Der opstod en fejl. Prøv igen.");
							}
						},
						success: function(response) {
							location.reload(true);
						}
					});
				}
			}
			
			function SearchService() {
				this.init = function() {
					$('#addSubstituteAutocompletePerson').on('input', function() {
						searchService.executeQuery();
					});
				}
				
				this.executeQuery = function() {
					$('#inputAddonInternal').show();
					var value = $('#addSubstituteAutocompletePerson').val();
					if (value.length >= 2) {					
						$.ajax({
							url: substituteRestUrl + "/search/person?query=" + $('#addSubstituteAutocompletePerson').val(),
							method: "get",
							success: function(response) {
								if (response == null || response.length < 1) {
									searchService.updateDropdown(null);
								}
								
								var resultSet = [];

								for (var j = 0; j < response.length; j++) {

									var hit = { value: response[j].value.replace(/'/g, '\u2019'), uuid: response[j].data};
									resultSet.push(hit);
								}
								
								searchService.updateDropdown(resultSet);
							}
						});
					}
					else {
						searchService.updateDropdown(null);
					}
				}
				
				this.updateDropdown = function (resultSet) {
					if (resultSet && resultSet.length > 0) {
						$("#searchResultDropDownMenuInternal").empty();
						
						for (var i = 0; i < resultSet.length; i++) {
							
							var guiValue = resultSet[i].value;
							var uuid = resultSet[i].uuid;
							$("#searchResultDropDownMenuInternal").append("<a href='#' style='color: black;' onclick=\"searchService.select('" + uuid + "','" + guiValue + "')\"><li>" + guiValue + "</li></a>");
						}
						
						$("#searchResultDropDownMenuInternal").addClass("show");
					}
					else {
						$("#searchResultDropDownMenuInternal").removeClass("show");
					}
				}
				
				this.select = function(uuid, gui) {
					$("#realPersonField").val(uuid);
					$('#addSubstituteAutocompletePerson').val(gui);
					
					window.setTimeout(function(){
						searchService.updateDropdown(null);
					}, 100);
					
				}
			}
			
		/*]]>*/
	</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header(datatables = true, datepicker = true)}" />
<body class="top-navigation">
	<div id="wrapper">
	    <nav th:replace="~{fragments/navbar :: navbar-aside(page='affiliations')}" />
	    <div id="page-wrapper" class="gray-bg">
	    	<nav th:replace="~{fragments/navbar :: navbar-header}" />

	        <div class="wrapper wrapper-content">
				<div class="row">
	                <div class="col-lg-12">
                        <div class="ibox">
                            <div class="ibox-title">
                                <h5><em class="fa fa-handshake-o"></em> &nbsp; Tilhørsforhold</h5>
                            </div>
                            <div class="ibox-content" >
								<div th:utext="${@textService.getText('AFFILIATION_HELPTEXT')}"></div>

								<div id="personFilter" style="margin-bottom: 10px;">
									<label style="margin-right: 20px;">
										<input type="radio" name="personFilter" value="active" class="i-checks" checked/>
										Vis aktuelle personer
									</label>
									<label>
										<input type="radio" name="personFilter" value="deleted" class="i-checks"/>
										Vis slettemarkerede personer
									</label>
								</div>

	                        	<table id="affiliations" class="table table-hover col-lg-12">
			                		<thead>
										<tr>
											<th class="col-lg-4">Navn</th>
											<th class="col-lg-2">Stilling</th>
											<th class="col-lg-2">Enhed</th>
											<th class="col-lg-1">Startdato</th>
											<th class="col-lg-1">Stopdato</th>
											<th class="col-lg-1">It-bruger</th>
											<th class="col-lg-1">Status</th>
											<th class="col-lg-1">Handlinger</th>
										</tr>
										<tr class="dt-column-filters">
											<th><input type="text" class="form-control input-sm" placeholder="Filtrér"/></th>
											<th><input type="text" class="form-control input-sm" placeholder="Filtrér"/></th>
											<th><input type="text" class="form-control input-sm" placeholder="Filtrér"/></th>
											<th><input type="text" class="form-control input-sm" placeholder="Filtrér"/></th>
											<th><input type="text" class="form-control input-sm" placeholder="Filtrér"/></th>
											<th><input type="text" class="form-control input-sm" placeholder="Filtrér"/></th>
											<th><input type="text" class="form-control input-sm" placeholder="Filtrér"/></th>
											<th></th>
										</tr>
									</thead>
					                <tbody>
						                <tr th:each="affiliation: ${affiliations}" th:attr="data-deleted=${affiliation.deleted}">
						                	<td th:text="${affiliation.personName}"/>
						                	<td th:text="${affiliation.positionName}"/>
											<td th:text="${affiliation.orgUnitName}"/>
											<td th:text="${#temporals.format(affiliation.startDate, 'dd/MM/yyyy')}" th:attr="data-order=${affiliation.startDate != null ? #temporals.format(affiliation.startDate, 'yyyy-MM-dd') : '9999-12-31'}"/>
											<td th:text="${#temporals.format(affiliation.stopDate, 'dd/MM/yyyy')}" th:attr="data-order=${affiliation.stopDate != null ? #temporals.format(affiliation.stopDate, 'yyyy-MM-dd') : '9999-12-31'}"/>
											<td th:text="${affiliation.adUserInfo}"/>
											<td>
												<span th:if="${affiliation.deleted}" class="badge badge-danger">Slettemarkeret</span>
												<span th:if="${!affiliation.deleted and !affiliation.active}" class="badge badge-warning">Inaktiv</span>
												<span th:if="${!affiliation.deleted and affiliation.active}" class="badge badge-primary">Aktiv</span>
											</td>
											<td>
												<em onclick="affiliationService.openEditModal(this);" style="cursor:pointer;color: black;" th:attr="data-id=${affiliation.id}, data-position=${affiliation.positionName}, data-positiondisplayname=${affiliation.positionDisplayName}, data-start=${affiliation.startDate}, data-stop=${affiliation.stopDate}, data-internalreference=${affiliation.internalReference}, data-personname=${affiliation.personName}, data-orgunitname=${affiliation.orgUnitName}, data-aduserinfo=${affiliation.adUserInfo}" class="fa fa-fw fa-pencil"></em>
											</td>
										</tr>
					                </tbody>
			                	</table>
	                        </div>
	                    </div>
	                </div>
	            </div>
	        </div>
	    </div>
	</div>
	
	<!-- edit affiliation modal -->
	<div class="modal fade" id="modal-edit-affiliation" role="dialog">
		<div class="form-horizontal modal-dialog modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<h4>Rediger tilhørsforhold</h4>
				</div>
	
				<div class="modal-body">
					<input id="id" hidden>
					<div class="form-group row">
						<label class="col-sm-2 control-label">Navn</label>
						<div class="col-sm-8">
							<p class="form-control-static" id="modalPersonName"></p>
						</div>
					</div>
					<div class="form-group row">
						<label class="col-sm-2 control-label">Enhed</label>
						<div class="col-sm-8">
							<p class="form-control-static" id="modalOrgUnitName"></p>
						</div>
					</div>
					<div class="form-group row">
						<label class="col-sm-2 control-label">It-bruger</label>
						<div class="col-sm-8">
							<p class="form-control-static" id="modalAdUserInfo"></p>
						</div>
					</div>
					<hr/>
					<div class="form-group row">
						<label class="col-sm-2 control-label">Stilling *</label>
						<div class="col-sm-8">
							<input type="text" class="form-control cleanable" id="position"/>
						</div>
					</div>
					<div class="form-group row">
						<label class="col-sm-2 control-label">Alternativ stillingsbetegnelse</label>
						<div class="col-sm-8">
							<input type="text" class="form-control cleanable" id="positionDisplayName"/>
						</div>
					</div>
					<div class="form-group row">
						<label class="col-sm-2 control-label">Startdato</label>
						<div class="col-sm-8">
							<input type="text" class="form-control date cleanable" id="startDate" disabled="disabled"/>
						</div>
					</div>
					<div class="form-group row">
						<label class="col-sm-2 control-label">Slutdato</label>
						<div class="col-sm-8">
							<input type="text" class="form-control date cleanable" id="stopDate"/>
						</div>
					</div>
					<div class="form-group row">
						<label class="col-sm-2 control-label">Intern reference</label>
						<div class="col-sm-8">
							<input type="text" class="form-control cleanable" id="internalReference"/>
						</div>
					</div>
					<div class="form-group row">
						<label class="col-sm-2 control-label" th:text="${@managerConfiguration.getEmail().isEnabled()} ? 'Begrundelse for ændring *' : 'Begrundelse for ændring'"></label>
						<div class="col-sm-8">
							<textarea rows="4" class="form-control cleanable" id="reason" maxlength="1000"></textarea>
						</div>
					</div>
				</div>
	
				<div class="modal-footer">
					<button id="saveEdit" type="button" class="btn btn-primary" onclick="affiliationService.editAffiliation()">Gem</button>
					<button id="endAffiliation" type="button" class="btn btn-warning" onclick="affiliationService.endAffiliation()">Afslut tilhørsforhold</button>
					<button type="button" class="btn btn-danger" data-dismiss="modal">Annuller</button>
				</div>
			</div>
		</div>
	</div>
	
	<div th:replace="~{fragments/footer :: scripts(datatables = true, datepicker = true)}"></div>
	<script th:inline="javascript">
		/*<![CDATA[*/
		
			/*[+
				var affiliationRestUrl = [[@{/rest/affiliations}]];
				var mailEnabled = [[${@managerConfiguration.getEmail().isEnabled()}]];
				var maxStopDateFutureDays = [[${maxStopDateFutureDays}]];
			+]*/

			var token = $("meta[name='_csrf']").attr("content");
			var affiliationService;
			$(document).ready(function () {
				affiliationService = new AffiliationService();
				affiliationService.init();
			});

			function AffiliationService() {

				this.init = function() {
					var datepickerOptions = {
						forceParse: false,
						autoclose: true,
						weekStart: 1,
						format: "dd/mm/yyyy",
						orientation: "bottom",
						enableOnReadonly: false,
						language: "da"
					};
					if (maxStopDateFutureDays != null) {
						datepickerOptions.endDate = "+" + maxStopDateFutureDays + "d";
					}
					var self = this;
					$('#stopDate').datepicker(datepickerOptions)
						.on('changeDate clearDate', function () { self.refreshEndButtonState(); });
					$('#stopDate').on('input', function () { self.refreshEndButtonState(); });
					$('#startDate').datepicker({
						forceParse: false,
						autoclose: true,
						weekStart: 1,
						format: "dd/mm/yyyy",
						orientation: "bottom",
						enableOnReadonly: false,
						language: "da"
					});

					var lastColIndex = $("#affiliations thead tr:first th").length - 1;

					// custom row-level filter: aktiv vs slettemarkeret toggle. Affiliation-specific so it stays here.
					$.fn.dataTable.ext.search.push(function(settings, data, rowIdx, rowData, counter) {
						if (settings.nTable.id !== "affiliations") {
							return true;
						}
						var mode = $('input[name="personFilter"]:checked').val() || "active";
						var row = settings.aoData[rowIdx].nTr;
						var isDeleted = $(row).attr('data-deleted') === "true";
						return mode === "deleted" ? isDeleted : !isDeleted;
					});

					var table = $('#affiliations').DataTable($.extend(true, {},
						DTEnhance.standardOptions({ itemNamePlural: 'tilhørsforhold', excelTitle: 'Tilhørsforhold' }),
						{ columnDefs: [ { orderable: false, searchable: false, targets: lastColIndex } ] }
					));
					DTEnhance.applyEnhancements(table);

					$('input[name="personFilter"]').on('ifChanged change', function () {
						table.draw();
					});
				}
				
				this.openEditModal = function(elem) {
					$(".cleanable").val("");

					var id = $(elem).data('id');
					var position = $(elem).data('position');
					var positionDisplayName = $(elem).data('positiondisplayname');
					var startDate = $(elem).data('start');
					var stopDate = $(elem).data('stop');
					var internalReference = $(elem).data('internalreference');
					var personName = $(elem).data('personname');
					var orgUnitName = $(elem).data('orgunitname');
					var adUserInfo = $(elem).data('aduserinfo');

					$("#id").val(id);
					$("#position").val(position);
					$("#positionDisplayName").val(positionDisplayName);
					$("#internalReference").val(internalReference);
					$("#modalPersonName").text(personName || "");
					$("#modalOrgUnitName").text(orgUnitName || "");
					$("#modalAdUserInfo").text(adUserInfo || "");

					$("#startDate").datepicker("update", startDate ? new Date(startDate) : null);
					$("#stopDate").datepicker("update", stopDate ? new Date(stopDate) : null);
					this.refreshEndButtonState();

					$('#modal-edit-affiliation').modal('show');
				}

				this.refreshEndButtonState = function() {
					var val = $("#stopDate").val();
					var disabled = false;
					if (val) {
						var parts = val.split('/');
						if (parts.length === 3) {
							var stop = new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
							stop.setHours(0, 0, 0, 0);
							var today = new Date();
							today.setHours(0, 0, 0, 0);
							disabled = stop <= today;
						}
					}
					$("#endAffiliation").prop("disabled", disabled);
				}

				this.endAffiliation = function() {
					var self = this;
					swal({
						title : "Afslut tilhørsforhold",
						text : "Er du sikker på at du vil afslutte tilhørsforholdet med dags dato?",
						type : "warning",
						showCancelButton : true,
						confirmButtonColor : "#DD6B55",
						confirmButtonText : "Afslut",
						cancelButtonText : "Annuller",
						closeOnConfirm : true,
						closeOnCancel : true
					},
					function(isConfirm) {
						if (isConfirm) {
							$("#stopDate").datepicker("update", new Date());
							self.editAffiliation();
						}
					});
				}
				
				this.editAffiliation = function() {
					var position = $("#position").val();
					var reason = $("#reason").val();
					if (position == null || position === "") {
						toastr.error("Stillingsbetegnelse skal være udfyldt");
						return;
					}

					if (mailEnabled && (reason == null || reason === "")) {
						toastr.error("Begrundelse skal være udfyldt");
						return;
					}

					payload = {
						id: $("#id").val(),
						position: position,
						positionDisplayName: $("#positionDisplayName").val(),
						startDate: $("#startDate").val(),
						stopDate: $("#stopDate").val(),
						internalReference : $("#internalReference").val(),
						reason : reason
					};

					$.ajax({
						contentType: 'application/json',
						url: affiliationRestUrl + "/edit",
						method : "POST",
						data: JSON.stringify(payload),
						headers: {
							'X-CSRF-TOKEN': token
						},
						error: function(jqXHR, textStatus, errorThrown) {
							if (jqXHR.responseText != null && jqXHR.responseText != "" ) {
								toastr.error(jqXHR.responseText);
							} else {
								toastr.error("Der opstod en fejl. Prøv igen.");
							}
						},
						success: function(response) {
							$('#modal-edit-affiliation').modal('hide');
							location.reload(true);
						}
					});
				}
			}
		/*]]>*/
	</script>
</body>
</html>

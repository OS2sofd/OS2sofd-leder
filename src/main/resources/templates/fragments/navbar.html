<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/html">
<body>
	<nav th:fragment="navbar-header" class="navbar navbar-static-top" role="navigation" style="color: #000000 !important; background-color: #FDFEFF !important; height: 70px;">
        <div class="navbar-header">
        </div>
        
        <ul class="nav navbar-top-links navbar-right">
            <li sec:authorize="isAuthenticated()" class="dropdown show">
            	<a  data-toggle="dropdown" href="#" aria-expanded="true" id="userMenuTopbar">
					<i class="fa fa-user"></i>&nbsp;
					<span th:text="${T(dk.digitalidentity.security.SecurityUtil).getCurrentContext().name()}"></span>
				</a>
                <ul class="dropdown-menu" style="width: 400px;">
               		<li>
                    	<div class="list-group">
			                <div class="list-group-item">
								<span style="font-size: medium;">Log ind som:</span>

								<ul id="contextList" style="padding-left: 0px;">
									<th:block th:each="context : ${T(dk.digitalidentity.security.SecurityUtil).getLoggedInUser().contexts()}">
										<li>
											<a th:href="@{'/chooseContext?id=' + ${context.id()}}" style="color: black; border: none; font-size: small;" class="list-group-item">
												<em th:class="'fa ' + ${context.id() == T(dk.digitalidentity.security.SecurityUtil).getCurrentContext().id() ? 'fa-check-circle-o' : 'fa-circle-o'}"></em>
												<span th:text="${context.name()}" style="padding-left: 10px"></span>
											</a>
										</li>
									</th:block>
								<ul>
							</div>
							
							<div sec:authorize="hasRole('ROLE_ADMIN')" class="list-group-item">
								<ul style="padding-left: 0px;">
									<li>
			                            <a th:href="@{/admin/helptext/edit}" style="color: black; border: none; font-size: small;">
			                                <i class="fa fa-pencil"></i> &nbsp; Rediger tekster
			                            </a>
			                        </li>
			                    </ul>
			                </div>

							<div class="list-group-item">
								<ul style="padding-left: 0px;">
									<li>
			                            <a th:href="@{/saml/logout}" style="color: black; font-size: medium;">
			                                <i class="fa fa-sign-out"></i> &nbsp; Log ud
			                            </a>
			                        </li>
			                    </ul>
			                </div>
                    	</div>
                    </li>
          		</ul>
        	</li>
        </ul>

    </nav>

	<nav th:fragment="navbar-aside" class="navbar-default navbar-static-side navbar-expand" role="navigation" style="color: #000000 !important; background-color: #FDFEFF !important; width: 275px;">
        <div class="sidebar-collapse">
			<a href="/">
				<img th:src="@{/custom/logo.svg(cache=${@buildProperties.getTime().getEpochSecond()})}" alt="logo" style="margin: 10px 20px 5px 20px">
			</a>

            <ul class="nav metismenu" id="side-menu" style="margin-top: 25px;">
                <li th:classappend="${page == 'welcome'} ? 'active' : ''">
                    <a href="/"><div><span class="nav-label"><em class="fa fa-home"></em> &nbsp; Velkommen</span></div></a>
                </li>
                <th:block sec:authorize="isAuthenticated()">
					<li th:if="${@managerConfiguration.getModules().getFunctionHierarchy().isShowAllFunctionsEnabled()}" th:classappend="${page == 'allFunctionAssignments'} ? 'active' : ''">
						<a sec:authorize="hasRole('ROLE_MANAGER') or hasRole('ROLE_SUBSTITUTE') or hasRole('ROLE_READER') or hasRole('ROLE_ADMIN')" href="/allFunctionassignments"><div><span class="nav-label"><em class="fa fa-list"></em> &nbsp; Alle medarbejderfunktioner</span></div></a>
					</li>	
                	<li th:each="category : ${@SOFDFunctionAssignmentService.getAllCategories()}" th:classappend="${#strings.equalsIgnoreCase(page, category.key)} ? 'active' : ''">
                		<a sec:authorize="hasRole('ROLE_MANAGER') or hasRole('ROLE_SUBSTITUTE') or hasRole('ROLE_READER') or hasRole('ROLE_ADMIN')" href="#"><div><span class="nav-label"><em class="fa fa-list"></em> &nbsp;<span th:text="${category.key}"></span></span></div></a>
                		<ul class="nav nav-second-level" style="color: #000000 !important; background-color: #FDFEFF !important;">
	                    	<li th:each="function : ${category.value}" th:classappend="${subpage == function.id} ? 'active' : ''">
	                    		<a style="padding-left: 45px; padding-top: 5px; padding-bottom: 5px;" th:href="'/functionassignments?function=' + ${function.id}">
	                    			<span th:text="${function.name}"></span>
	                    		</a>
	                    	</li>
	                    </ul>
                	</li>
	                <li th:if="${@managerConfiguration.getModules().getSubstituteModule().isEnabled()}" th:classappend="${page == 'substitutes'} ? 'active' : ''">
	                    <a sec:authorize="hasRole('ROLE_MANAGER')" href="/substitutes"><div><span class="nav-label"><em class="fa fa-users"></em> &nbsp; Stedfortrædere</span></div></a>
	                </li>
					<li th:if="${@managerConfiguration.getModules().getAccountApprovalModule().isEnabled()}" th:classappend="${page == 'pendingapprovals'} ? 'active' : ''">
						<a sec:authorize="hasRole('ROLE_MANAGER') or hasRole('ROLE_SUBSTITUTE')" href="/pendingapprovals"><div><span class="nav-label"><em class="fa fa-thumbs-up"></em> &nbsp; Kontogodkendelse</span></div></a>
					</li>
					<li th:if="${@managerConfiguration.getModules().getAffiliationModule().isEnabled()}" th:classappend="${page == 'affiliations'} ? 'active' : ''">
						<a sec:authorize="hasRole('ROLE_MANAGER') or hasRole('ROLE_SUBSTITUTE')" href="/affiliations"><div><span class="nav-label"><em class="fa fa-handshake-o"></em> &nbsp; Tilhørsforhold</span></div></a>
					</li>
					<li th:if="${@managerConfiguration.getModules().getPausePersonModule().isEnabled()}" th:classappend="${page == 'pausablePeople'} ? 'active' : ''">
						<a sec:authorize="hasRole('ROLE_MANAGER') or hasRole('ROLE_SUBSTITUTE')" href="/leave"><div><span class="nav-label"><em class="fa fa-pause"></em> &nbsp; Pausemarkering</span></div></a>
					</li>
					<li th:if="${@managerConfiguration.getModules().getManagerModule().isEnabled()}" th:classappend="${page == 'managers'} ? 'active' : ''">
						<a sec:authorize="hasRole('ROLE_ADMIN') or hasRole('ROLE_MANAGER_EDITOR')" href="/managers"><div><span class="nav-label"><em class="fa fa-chevron-circle-up"></em> &nbsp; Lederopmærkning</span></div></a>
					</li>
                </th:block>
                <li>
                	<a sec:authorize="!isAuthenticated()" href="/saml/login"><span class="nav-label"><em class="fa fa-sign-in"></em> &nbsp; Login</span></a>
                </li>
            </ul>
        </div>
  	</nav>
		
</body>
</html>
